# Upper School Open House: Student Interest Tables.
# Source: "Student Interest Tables, US Open House" (Google Doc, updated November 4, 2026).
# Student ambassadors' names are left off on purpose (public site), as are the
# document's event-day assignments (group leaders, sign-in, panel moderators and panelists).
# Student-led tables set studentLed: true.
eyebrow: Upper School Open House
title: Student Interest Tables
seal: seal-upper-school   # public/brand/seal-upper-school.png (from the 2021 Brand Guidelines)
summary: Find the departments, programs and clubs you want to visit, and where each table is.
icon: tables
type: directory
intro: |
  Faculty and student ambassadors are waiting at tables in three spaces, and most tables have student ambassadors ready to answer questions. Tap a topic or a space, or search for a subject, activity or person (try "biology" or "theater").
# Topic buttons shown above the tables. Each table lists one or more ids under categories.
categories:
  - { id: academics, label: Academics }
  - { id: arts, label: Arts }
  - { id: athletics, label: Athletics }
  - { id: clubs, label: Clubs }
  - { id: support, label: Counseling & Support }
  - { id: life, label: Student Life & Trips }
